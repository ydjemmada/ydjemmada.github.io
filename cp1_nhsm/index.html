<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropdowns = document.querySelectorAll('.site-menu-dropdown');
    
    dropdowns.forEach(dropdown => {
        const toggle = dropdown.querySelector('.site-menu-dropdown-toggle');
        
        
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            const isOpen = dropdown.classList.contains('is-open');
            
            
            dropdowns.forEach(d => {
                d.classList.remove('is-open');
                d.querySelector('.site-menu-dropdown-toggle').setAttribute('aria-expanded', 'false');
            });
            
            if (!isOpen) {
                dropdown.classList.add('is-open');
                toggle.setAttribute('aria-expanded', 'true');
            }
        });
    });
    
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.site-menu-dropdown')) {
            dropdowns.forEach(dropdown => {
                dropdown.classList.remove('is-open');
                dropdown.querySelector('.site-menu-dropdown-toggle').setAttribute('aria-expanded', 'false');
            });
        }
    });
});
</script>
