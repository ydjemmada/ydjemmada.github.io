{{ define "main" }}
<main class="dzjc-wrap dzjc-page" aria-labelledby="dzjc-title">
    <nav class="dzjc-breadcrumb" aria-label="Breadcrumb">
        <a href="/DZJC/">DZ Journal Check</a>
        <span aria-hidden="true">/</span>
        <span>{{ .Title }}</span>
    </nav>
    <article>
        <header class="dzjc-page-header">
            <p class="dzjc-kicker">DZJC</p>
            <h1 id="dzjc-title">{{ .Title }}</h1>
            {{ with .Description }}<p class="dzjc-lead">{{ . }}</p>{{ end }}
        </header>
        <div class="dzjc-content">
            {{ .Content }}
        </div>
    </article>
</main>
{{ end }}
