<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {{ if eq .Type "dzjc" }}
  "@type": "WebPage",
  "name": {{ .Title | jsonify | safeJS }},
  "url": "{{ .Permalink }}",
  "description": {{ (.Description | default .Site.Params.description) | plainify | htmlUnescape | jsonify | safeJS }},
  "about": {
    "@type": "SoftwareApplication",
    "name": "DZ Journal Check",
    "applicationCategory": "BrowserApplication",
    "operatingSystem": "Chrome",
    "softwareVersion": "1.0.7",
    "url": "https://chromewebstore.google.com/detail/dz-journal-check/ggekciegmhcfnbnlhdldkjlifmmncedn",
    "description": "DZ Journal Check is publicly available on the Chrome Web Store and helps researchers check Algerian DGRSDT/MESRS journal classifications on Google Scholar."
  }
  {{ else if .IsHome }}
  "@type": "Person",
  "name": "{{ .Site.Params.author }}",
  "url": "{{ .Site.BaseURL }}",
  "email": "mailto:{{ site.Params.email }}",
  {{- $urls := slice }}{{ range site.Params.profiles }}{{ with .url }}{{ $urls = $urls | append . }}{{ end }}{{ end }}
  "sameAs": {{ $urls | jsonify | safeJS }},
  "jobTitle": "{{ site.Params.jobTitle }}",
  "knowsAbout": {{ site.Params.researchAreas | jsonify | safeJS }},
  "worksFor": {
    "@type": "CollegeOrUniversity",
    "name": "{{ site.Params.institution }}",
    "url": "{{ site.Params.institutionURL }}"
  },
  "description": {{ .Site.Params.description | jsonify | safeJS }}
  {{ else if .IsPage }}
  "@type": "Article",
  "headline": {{ .Title | jsonify | safeJS }},
  "image": [
    {{ if .Params.image }}"{{ .Params.image | absURL }}"{{ else }}"{{ site.Params.ogImage | absURL }}"{{ end }}
   ],
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Person",
    "name": "{{ .Site.Params.author }}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ .Site.Params.author }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.Params.ogImage | absURL }}"
    }
  },
  "description": {{ (.Description | default .Site.Params.description) | plainify | htmlUnescape | jsonify | safeJS }}
  {{ else }}
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}"
  {{ end }}
}
</script>
